name: Publisher

# Always-on publisher. One run stays awake ~5h40m posting each item on time, then re-dispatches
# itself. The cron + push triggers only (re)start the chain if it ever breaks, because GitHub's
# cron alone is unreliable (it dropped 26 of 28 runs on 15 Oct 2026).
on:
  schedule:
    - cron: "7 */3 * * *"
  push:
    branches: [main]
    paths: ["content/queue/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish loop
        env:
          IG_LOGIN: instagram
          IG_API_VERSION: v23.0
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          pip install -q requests
          git config user.name "thd-bot"
          git config user.email "actions@users.noreply.github.com"
          python publish_loop.py

      - name: Hand off to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
