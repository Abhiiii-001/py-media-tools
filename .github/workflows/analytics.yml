name: Nightly analytics

on:
  schedule:
    - cron: "17 18 * * *"   # 11:47 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull insights
        env:
          IG_LOGIN: instagram
          IG_API_VERSION: v23.0
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          pip install -q requests
          mkdir -p analytics
          python ig_api.py report 30 > analytics/latest.json
      - name: Save
        run: |
          git config user.name "thd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add analytics
          git diff --cached --quiet || (git commit -m "Nightly analytics" && git pull --rebase && git push)
